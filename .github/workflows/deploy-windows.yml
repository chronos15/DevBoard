name: Deploy TaskBoard - Windows Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taskboard-windows-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy on physical Windows server
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Deploy release
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ".\scripts\windows\deploy-taskboard.ps1"
