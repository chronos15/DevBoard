plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.softworksistema.taskboard.sharebridge'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.softworksistema.taskboard.sharebridge'
        minSdk 24
        targetSdk 35
        versionCode 224
        versionName '1.0.0-v224'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
