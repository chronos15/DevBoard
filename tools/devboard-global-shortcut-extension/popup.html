<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Devboard</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { width: 320px; margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 6px 0 0; font-size: 12px; line-height: 1.45; opacity: .72; }
    .url { margin-top: 12px; padding: 10px 12px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 10px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: grid; gap: 8px; margin-top: 12px; }
    button { min-height: 38px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); background: transparent; color: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: #f25436; border-color: #f25436; color: white; }
    small { display: block; margin-top: 10px; line-height: 1.45; opacity: .62; }
    #status { min-height: 17px; color: #f25436; }
  </style>
</head>
<body>
  <h1>Devboard · Atalho global</h1>
  <p>Use <strong>Ctrl + Shift + 7</strong> de qualquer aplicativo do Windows para voltar ao Painel Dev.</p>
  <div id="current" class="url">Carregando…</div>
  <div class="actions">
    <button id="bind">Usar esta aba como Devboard</button>
    <button id="open" class="primary">Abrir Painel Dev agora</button>
    <button id="options">Configurar endereço</button>
  </div>
  <small id="status"></small>
  <script src="popup.js"></script>
</body>
</html>
